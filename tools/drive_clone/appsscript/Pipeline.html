<script>
/* Drive Clone — LÕI nghiệp vụ (chạy trên trình duyệt, trong web app Apps Script).
   scan → plan → clone → đổi link → mục lục → hậu kiểm → Change Log. Port 1-1 từ bản Python cũ
   (tools/drive_clone/pipeline.py + changelog.py) — cùng thuật toán, cùng tên hàm (camelCase).

   Lõi chỉ nói chuyện với 1 "backend" bất đồng bộ:
     GasBackend  (App.html)  → google.script.run → Code.gs → Google Drive / Sheets API bằng tài khoản của CHÍNH người dùng
     FakeDrive   (dưới đây)  → Drive giả lập trong bộ nhớ: chế độ Demo + test tự động (tests/js/driveclone_gas.test.js)
   Đường dẫn trong cây lưu dạng MẢNG các phần (parts), vì tên thư mục Drive được phép chứa "/". */
var DC = (function () {
  "use strict";
  var FOLDER_MIME = "application/vnd.google-apps.folder";
  var SHORTCUT_MIME = "application/vnd.google-apps.shortcut";
  var SHEET_MIME = "application/vnd.google-apps.spreadsheet";
  var DOC_MIME = "application/vnd.google-apps.document";
  var SLIDE_MIME = "application/vnd.google-apps.presentation";
  var DRAW_MIME = "application/vnd.google-apps.drawing";
  var FORM_MIME = "application/vnd.google-apps.form";
  var XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  var GOOGLE_PREFIX = "application/vnd.google-apps.";
  var NATIVE_CREATABLE = [DOC_MIME, SHEET_MIME, SLIDE_MIME, DRAW_MIME];
  var PROP_SRC = "gdk_src";
  var MY_DRIVE = "root";
  var PATH_SEP = "  /  ", LOG_SEP = " / ", LOG_PREFIX = "Change Log – ", INDEX_TITLE = "_INDEX_AUTO";
  var DEFAULT_MASTER_PATTERN = "master|tong\\s*hop|tổng\\s*hợp|index|summary|muc\\s*luc|mục\\s*lục";
  var ID_IN_URL = /(?:\/folders\/|\/d\/|[?&]id=)([A-Za-z0-9_-]{10,})/g;
  var noop = function () {};

  function nowIso() {
    var d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) + "T" + z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
  }
  function showPath(parts) { return parts && parts.length ? parts.join(PATH_SEP) : "(gốc)"; }
  function parseId(text) {
    text = String(text || "").trim();
    if (!text) return "";
    var m = /(?:\/folders\/|\/d\/|[?&]id=)([A-Za-z0-9_-]{10,})/.exec(text);
    if (m) return m[1];
    return text.split("?")[0].replace(/^\/+|\/+$/g, "");
  }
  function viewUrl(id, mime) {
    if (mime === FOLDER_MIME) return "https://drive.google.com/drive/folders/" + id;
    if (mime === SHEET_MIME) return "https://docs.google.com/spreadsheets/d/" + id + "/edit";
    if (mime === DOC_MIME) return "https://docs.google.com/document/d/" + id + "/edit";
    if (mime === SLIDE_MIME) return "https://docs.google.com/presentation/d/" + id + "/edit";
    return "https://drive.google.com/file/d/" + id + "/view";
  }
  function isGoogle(mime) { return String(mime).indexOf(GOOGLE_PREFIX) === 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function key(parts) { return JSON.stringify(parts); }

  /** Chạy fn trên từng phần tử, tối đa n việc cùng lúc, kết quả giữ đúng thứ tự đầu vào. */
  function mapLimit(items, n, fn) {
    var out = new Array(items.length), next = 0;
    function lane() {
      if (next >= items.length) return Promise.resolve();
      var i = next++;
      return Promise.resolve().then(function () { return fn(items[i], i); }).then(function (v) { out[i] = v; return lane(); });
    }
    var lanes = [];
    for (var k = 0; k < Math.max(1, Math.min(n || 1, items.length)); k++) lanes.push(lane());
    return Promise.all(lanes).then(function () { return out; });
  }

  // ======================================================================== 1. QUÉT
  /** Quét cây theo từng tầng; các thư mục cùng tầng liệt kê song song (workers luồng). */
  async function scan(backend, rootId, o) {
    o = o || {};
    var log = o.log || noop, shouldStop = o.shouldStop || function () { return false; };
    var root;
    try { root = await backend.getFile(rootId); } catch (e) { throw new Error("Không đọc được thư mục A — " + (e.message || e)); }
    if (root.mimeType !== FOLDER_MIME) throw new Error("ID này không phải thư mục: " + (root.name || rootId));
    var items = [], seen = {}, nextLog = 200, frontier = [{ parts: [], id: rootId }], depth = 0, maxDepth = o.maxDepth || 30;
    seen[rootId] = 1;
    log("Quét thư mục: " + (root.name || "?"));
    while (frontier.length && depth <= maxDepth) {
      var lists = await mapLimit(frontier, Math.max(1, Math.min(o.workers || 4, 8)), function (entry) {
        if (shouldStop()) throw new Error("Đã dừng quét.");
        return backend.listChildren(entry.id);
      });
      var nxt = [];
      frontier.forEach(function (entry, fi) {
        lists[fi].forEach(function (child) {
          var cparts = entry.parts.concat([child.name]);
          var mime = child.mimeType;
          var item = {
            id: child.id, name: child.name, mime: mime, parts: cparts, path: showPath(cparts), parent_parts: entry.parts.slice(),
            depth: depth + 1, kind: mime === FOLDER_MIME ? "folder" : "file",
            bytes: parseInt(child.size || child.quotaBytesUsed || 0, 10) || 0,
            url: child.webViewLink || viewUrl(child.id, mime), props: child.appProperties || {},
          };
          if (mime === SHORTCUT_MIME) { item.kind = "shortcut"; item.target_id = (child.shortcutDetails || {}).targetId || ""; }
          items.push(item);
          if (mime === FOLDER_MIME && !seen[child.id]) { seen[child.id] = 1; nxt.push({ parts: cparts, id: child.id }); }
        });
      });
      if (items.length >= nextLog) { log("  … đã thấy " + items.length + " mục"); nextLog = items.length + 200; }
      frontier = nxt; depth++;
    }
    var folders = items.filter(function (i) { return i.kind === "folder"; }).length;
    log("Quét xong: " + folders + " thư mục, " + (items.length - folders) + " file");
    return {
      root: { id: rootId, name: root.name || "", url: viewUrl(rootId, FOLDER_MIME) }, scanned_at: nowIso(), items: items,
      stats: { folders: folders, files: items.length - folders, total: items.length,
        depth: items.reduce(function (m, i) { return Math.max(m, i.depth); }, 0),
        bytes: items.reduce(function (s, i) { return s + (i.kind === "file" ? i.bytes : 0); }, 0) },
    };
  }

  // ======================================================================== 2. ĐỔI TÊN
  /** Giữ kiểu chữ của đoạn bị thay: BSHP → PRSP, bshp → prsp, Bshp → Prsp. */
  function matchCase(sample, text) {
    if (sample === sample.toUpperCase()) return text.toUpperCase();
    if (sample === sample.toLowerCase()) return text.toLowerCase();
    if (sample.charAt(0) === sample.charAt(0).toUpperCase() && sample.slice(1) === sample.slice(1).toLowerCase())
      return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
    return text;
  }
  var escRe = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
  /** "\1" kiểu Python → "$1" kiểu JS; "$" người dùng gõ giữ nguyên là chữ. */
  var pyRepl = function (s) { return String(s).replace(/\$/g, "$$$$").replace(/\\(\d+)/g, "$$$1"); };
  function applyRule(name, rule) {
    var src = rule.from || "";
    if (!src) return name;
    var dst = rule.to || "", ic = !!rule.ignore_case;
    if (rule.regex) {
      try { return name.replace(new RegExp(src, ic ? "gi" : "g"), pyRepl(dst)); } catch (e) { return name; }
    }
    if (!ic) return name.split(src).join(dst);
    return name.replace(new RegExp(escRe(src), "gi"), function (m) { return m === src ? dst : matchCase(m, dst); });
  }
  function rename(name, rules) { (rules || []).forEach(function (r) { name = applyRule(name, r); }); return name; }
  function ruleProblems(rules) {
    var out = [];
    (rules || []).forEach(function (r, i) {
      if (r.regex && r.from) { try { new RegExp(r.from); } catch (e) { out.push("Quy tắc " + (i + 1) + " — regex sai: " + e.message); } }
    });
    return out;
  }

  // ======================================================================== 3. KẾ HOẠCH
  var DEFAULT_OPTIONS = {
    dest_parent: "", content_mode: "full", wrap_root: false, new_root_name: "", rename_rules: [], item_modes: {},
    auto_master: true, master_pattern: DEFAULT_MASTER_PATTERN, binary_mode: "skeleton", uncreatable_mode: "placeholder_doc",
    shortcut_mode: "retarget", remap_links: "masters", build_index: false, skip_existing: true, write_log_sheet: true,
    dry_run: false, workers: 4,
  };
  function normalizeOptions(opts) {
    var o = Object.assign({}, DEFAULT_OPTIONS, opts || {});
    if (o.remap_links === true) o.remap_links = "masters";
    else if (o.remap_links === false || o.remap_links == null || o.remap_links === "") o.remap_links = "off";
    o.rename_rules = (o.rename_rules || []).filter(function (r) { return r && r.from; });
    o.item_modes = Object.assign({}, o.item_modes || {});
    return o;
  }
  /** Sheet / xlsx khớp tên mẫu hoặc nằm ngay ở gốc = master (copy đầy đủ + đổi link). */
  function pickMasters(manifest, opts) {
    var chosen = {};
    if (opts.auto_master === false) return chosen;
    var pat;
    try { pat = new RegExp(opts.master_pattern || DEFAULT_MASTER_PATTERN, "i"); } catch (e) { pat = new RegExp(DEFAULT_MASTER_PATTERN, "i"); }
    manifest.items.forEach(function (it) {
      if (it.kind !== "file" || (it.mime !== SHEET_MIME && it.mime !== XLSX_MIME)) return;
      if (pat.test(it.name) || it.parts.length === 1) chosen[it.id] = 1;
    });
    return chosen;
  }
  function mkOp(item, rules, kind, note) {
    var dstName = rename(item.name, rules), dstParts = item.parts.map(function (p) { return rename(p, rules); });
    return { kind: kind, item_kind: item.kind, src_id: item.id, src_name: item.name, src_parts: item.parts.slice(), src_path: item.path,
      src_url: item.url || "", mime: item.mime, dst_mime: item.mime, dst_name: dstName, dst_parts: dstParts, dst_path: showPath(dstParts),
      parent_parts: dstParts.slice(0, -1), depth: item.depth, size: item.bytes || 0, target_id: item.target_id || "",
      renamed: dstName !== item.name, master: false, remap: false, note: note };
  }
  function collisions(ops) {
    var seen = {}, order = [];
    ops.forEach(function (o) {
      var k = JSON.stringify([o.parent_parts, o.dst_name, o.kind === "folder"]);
      if (!seen[k]) { seen[k] = []; order.push(k); }
      seen[k].push(o.src_name);
    });
    var out = [];
    order.forEach(function (k) {
      var srcs = seen[k];
      if (srcs.length > 1) {
        var p = JSON.parse(k), uniq = srcs.filter(function (x, i) { return srcs.indexOf(x) === i; }).sort();
        out.push("Trùng tên sau khi đổi: " + srcs.length + " mục → '" + p[1] + "' trong " + showPath(p[0]) + " (" + uniq.join(", ").slice(0, 160) + ")");
      }
    });
    return out.slice(0, 30);
  }
  function buildPlan(manifest, opts) {
    opts = normalizeOptions(opts);
    var rules = opts.rename_rules, masters = pickMasters(manifest, opts), modes = Object.assign({}, opts.item_modes);
    var full = opts.content_mode === "full", remap = opts.remap_links;
    // để trống B = My Drive: luôn tạo thư mục mới (tool chỉ ghi được vào thư mục do chính nó tạo)
    var destId = parseId(opts.dest_parent) || MY_DRIVE;
    if (destId === MY_DRIVE) opts.wrap_root = true;
    var rootName = "";
    if (opts.wrap_root) rootName = String(opts.new_root_name || "").trim() || rename(manifest.root.name, rules);
    var ops = [], skippedParents = {};
    var sorted = manifest.items.slice().sort(function (a, b) { return a.depth - b.depth || (a.path < b.path ? -1 : a.path > b.path ? 1 : 0); });
    sorted.forEach(function (item) {
      var isFolder = item.kind === "folder", mode = modes[item.id], pk = key(item.parts);
      if (skippedParents[key(item.parent_parts)]) {
        if (isFolder) skippedParents[pk] = 1;
        ops.push(mkOp(item, rules, "skip", "nằm trong thư mục bị loại trừ")); return;
      }
      if (item.id === destId) { skippedParents[pk] = 1; ops.push(mkOp(item, rules, "skip", "đây là thư mục ĐÍCH (nằm trong nguồn) — không copy chính nó")); return; }
      if (mode === "skip") { if (isFolder) skippedParents[pk] = 1; ops.push(mkOp(item, rules, "skip", "bạn chọn bỏ qua")); return; }
      if (isFolder) { ops.push(mkOp(item, rules, "folder", "")); return; }
      if (item.kind === "shortcut") {
        ops.push(opts.shortcut_mode === "skip" ? mkOp(item, rules, "skip", "shortcut — bỏ qua") : mkOp(item, rules, "shortcut", "trỏ sang bản mới nếu đích nằm trong cây"));
        return;
      }
      var mime = item.mime, isMaster = !!masters[item.id], google = isGoogle(mime);
      var want = mode || (full || isMaster ? "copy" : "skeleton"), op;
      if (want === "copy") op = mkOp(item, rules, "copy", isMaster && !full ? "master — copy cả nội dung" : "");
      else if (google && NATIVE_CREATABLE.indexOf(mime) < 0) {
        var um = mode === "skeleton" ? "placeholder_doc" : opts.uncreatable_mode;
        if (um === "skip") op = mkOp(item, rules, "skip", "Google API không tạo rỗng được kiểu này");
        else if (um === "shortcut") { op = mkOp(item, rules, "shortcut", "kiểu đặc biệt → shortcut về bản gốc"); op.target_id = item.id; }
        else { op = mkOp(item, rules, "skeleton", "kiểu đặc biệt → tạo Doc rỗng thay thế"); op.dst_mime = DOC_MIME; }
      } else if (!google && mode == null && opts.binary_mode === "skip") op = mkOp(item, rules, "skip", "file nhị phân — bỏ qua");
      else op = mkOp(item, rules, "skeleton", "");
      op.master = isMaster;
      op.remap = op.kind === "copy" && (mime === SHEET_MIME || mime === XLSX_MIME) && (remap === "all" || (remap === "masters" && isMaster));
      ops.push(op);
    });
    var counts = {};
    ops.forEach(function (o) { counts[o.kind] = (counts[o.kind] || 0) + 1; });
    var active = ops.filter(function (o) { return o.kind !== "skip"; });
    var rootRenamed = !!rootName && rootName !== manifest.root.name;
    return {
      created_at: nowIso(), source: manifest.root, dest_parent: destId, wrap_root: !!opts.wrap_root, new_root_name: rootName,
      root_renamed: rootRenamed, options: opts, ops: ops, warnings: ruleProblems(rules).concat(collisions(active)),
      stats: { folders: counts.folder || 0, skeleton: counts.skeleton || 0, copy: counts.copy || 0, shortcut: counts.shortcut || 0, skip: counts.skip || 0,
        renamed: active.filter(function (o) { return o.renamed; }).length + (rootRenamed ? 1 : 0),
        remap: active.filter(function (o) { return o.remap; }).length,
        bytes_copy: active.reduce(function (s, o) { return s + (o.kind === "copy" ? o.size : 0); }, 0), total: ops.length, active: active.length },
    };
  }

  // ======================================================================== 4. CLONE
  var STATUS_LABEL = { CREATED: "tạo thư mục mới", MERGED: "gộp vào thư mục có sẵn", COPIED: "copy đầy đủ", SKELETON: "tạo vỏ rỗng",
    SHORTCUT: "tạo shortcut", EXISTS: "đã có ở đích — giữ nguyên", SKIPPED: "bỏ qua", ERROR: "lỗi" };

  /** Tạo bản sao. Các mục CÙNG TẦNG chạy song song; tầng sau chỉ bắt đầu khi tầng trước xong để thư mục cha luôn có
   *  trước. Shortcut làm sau cùng để trỏ được sang bản mới dù đích nằm sâu hơn. Change Log giữ đúng thứ tự kế hoạch. */
  async function execute(backend, plan, o) {
    o = o || {};
    var log = o.log || noop, progress = o.progress || noop, shouldStop = o.shouldStop || function () { return false; };
    var opts = plan.options, dry = !!opts.dry_run, skipExisting = opts.skip_existing !== false;
    var destParent = plan.dest_parent;
    if (!destParent) throw new Error("Chưa nhập thư mục ĐÍCH (B).");
    if (destParent === plan.source.id) throw new Error("Thư mục đích đang trùng thư mục nguồn.");
    var dest;
    try { dest = await backend.getFile(destParent); } catch (e) { throw new Error("Không mở được thư mục B — " + (e.message || e)); }
    if (dest.mimeType !== FOLDER_MIME) throw new Error("Link ĐÍCH không phải thư mục: " + (dest.name || destParent));
    var destName = dest.name || "", srcName = plan.source.name;
    var fresh = {}, listing = {}, counter = 0, workers = Math.max(1, Math.min(opts.workers || 4, 8));

    async function children(pid) {
      if (fresh[pid]) return [];
      if (!listing[pid]) listing[pid] = backend.listChildren(pid);       // lưu Promise → nhiều luồng chờ chung 1 lần gọi
      return listing[pid];
    }
    async function findExisting(pid, name, isFolder) {
      var kids = await children(pid);
      for (var i = 0; i < kids.length; i++) if (kids[i].name === name && (kids[i].mimeType === FOLDER_MIME) === isFolder) return kids[i];
      return null;
    }
    function make(kind, args, srcId) {
      counter++;
      if (dry) return Promise.resolve("DRY" + ("0000" + counter).slice(-5));
      var props = srcId ? { gdk_src: srcId } : null;
      if (kind === "folder") return backend.createFolder(args[0], args[1], props);
      if (kind === "empty") return backend.createEmpty(args[0], args[1], args[2], props);
      if (kind === "shortcut") return backend.createShortcut(args[0], args[1], args[2], props);
      return backend.copyFile(args[0], args[1], args[2], props);
    }
    var rootPrefix = [destName], entries = [];
    function entry(op, status, newId, note) {
      newId = newId || "";
      var kind = op.item_kind || "folder", newMime = op.dst_mime || FOLDER_MIME, dryId = newId.indexOf("DRY") === 0;
      return { time: nowIso().replace("T", " "), type: kind === "folder" ? "Folder" : kind === "shortcut" ? "Shortcut" : "File", status: status,
        renamed: op.renamed ? "YES" : "", old_name: op.src_name, new_name: op.dst_name,
        old_path: [srcName].concat(op.src_parts || []).join(LOG_SEP), new_path: rootPrefix.concat(op.dst_parts || []).join(LOG_SEP),
        note: note || op.note || "", mime: op.mime || FOLDER_MIME, size: kind === "file" ? (op.size === undefined ? "" : op.size) : "",
        old_link: op.src_url || "", new_link: newId && !dryId ? viewUrl(newId, newMime) : "", src_id: op.src_id, new_id: dryId ? "" : newId };
    }
    // -- thư mục gốc
    var rootOp = { item_kind: "folder", src_name: srcName, dst_name: plan.new_root_name, src_parts: [], dst_parts: [], src_id: plan.source.id,
      src_url: plan.source.url || "", renamed: plan.root_renamed };
    var rootId;
    if (plan.wrap_root) {
      rootPrefix.push(plan.new_root_name);
      var ex0 = skipExisting ? await findExisting(destParent, plan.new_root_name, true) : null;
      if (ex0) { rootId = ex0.id; log("Gộp vào thư mục có sẵn ở đích: " + plan.new_root_name); entries.push(entry(rootOp, "MERGED", rootId, "thư mục gốc đã có ở đích — gộp vào")); }
      else {
        rootId = await make("folder", [plan.new_root_name, destParent], plan.source.id);
        fresh[rootId] = 1; log("Tạo thư mục gốc: " + plan.new_root_name);
        entries.push(entry(rootOp, "CREATED", rootId, "thư mục gốc của bản sao"));
      }
    } else rootId = destParent;

    var pathMap = {}; pathMap[key([])] = rootId;
    var idMap = {}; idMap[plan.source.id] = rootId;
    var done = [], existing = [], failed = [], foreign = [], stopped = false;
    var order = plan.ops.slice().sort(function (a, b) {
      var sa = a.kind === "shortcut" ? 1 : 0, sb = b.kind === "shortcut" ? 1 : 0;
      return sa - sb || a.depth - b.depth || (a.dst_path < b.dst_path ? -1 : a.dst_path > b.dst_path ? 1 : 0);
    });
    var total = order.filter(function (x) { return x.kind !== "skip"; }).length, n = 0;
    progress(0, total);

    async function process(op) {
      var parentId = pathMap[key(op.parent_parts)];
      try {
        if (parentId == null) { failed.push(Object.assign({}, op, { error: "thư mục cha không tạo được" })); return entry(op, "ERROR", "", "thư mục cha không tạo được"); }
        var isFolder = op.kind === "folder";
        var ex = skipExisting ? await findExisting(parentId, op.dst_name, isFolder) : null;
        if (ex) {
          var ours = (ex.appProperties || {})[PROP_SRC] === op.src_id;
          idMap[op.src_id] = ex.id;
          if (isFolder) { pathMap[key(op.dst_parts)] = ex.id; return entry(op, "MERGED", ex.id, "thư mục đã có ở đích — gộp vào"); }
          if (ours) existing.push(Object.assign({}, op, { dst_id: ex.id })); else foreign.push(op.src_id);
          return entry(op, "EXISTS", ex.id, ours ? "đã clone ở lần chạy trước" : "đích đã có file cùng tên — giữ nguyên, không ghi đè");
        }
        var newId, status;
        if (isFolder) { newId = await make("folder", [op.dst_name, parentId], op.src_id); status = "CREATED"; }
        else if (op.kind === "skeleton") { newId = await make("empty", [op.dst_name, op.dst_mime, parentId], op.src_id); status = "SKELETON"; }
        else if (op.kind === "copy") { newId = await make("copy", [op.src_id, op.dst_name, parentId], op.src_id); status = "COPIED"; }
        else {
          var target = idMap[op.target_id] || op.target_id || op.src_id;

      if (o.remap_links !== "off" && remapTargets(result).length) { stage("remap"); log("--- Đổi link sang cây mới ---"); result.remap = await remapAll(backend, plan, result, { log: log, shouldStop: shouldStop }); }
