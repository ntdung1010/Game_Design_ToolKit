<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#0b0a10;--surface:#14121c;--deep:#0f0d16;--border:#27243a;--border-strong:#3a3552;--fg:#ecebf3;--muted:#a3a0b4;--faint:#6f6b82;
  --accent:#9d8cff;--accent-soft:rgba(157,140,255,.14);--accent-fg:#0b0a10;--ok:#4cc9a0;--ok-soft:rgba(76,201,160,.14);--warn:#f2c14e;--warn-soft:rgba(242,193,78,.14);
  --bad:#ff6b6b;--bad-soft:rgba(255,107,107,.14);--mono:ui-monospace,"Cascadia Code","Fira Code",Consolas,monospace;
  --rainbow:linear-gradient(90deg,#ff6b6b,#f2c14e,#4cc9a0,#5ab8ff,#9d8cff)}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f9;--surface:#fff;--deep:#f1eff6;--border:#e2dfeb;--border-strong:#cfcadd;--fg:#16141f;--muted:#5d596d;--faint:#8f8a9f;
  --accent:#6b55f0;--accent-soft:rgba(107,85,240,.1);--accent-fg:#fff;--ok:#1b8f6c;--warn:#a87a06;--bad:#c93636}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 120px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rainbow);opacity:.6}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}
header h1{margin:0;font-size:17px;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12.5px}
.grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border-strong)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-top:14px}
.ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.ph h2{margin:0;font-size:15px}.ph .sub{color:var(--muted);font-size:12.5px}.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{padding:15px 16px}
.step{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 12px var(--mono);border:1px solid var(--border-strong);flex:none}
label.lb{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=search],select{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--deep);color:var(--fg);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled{opacity:.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>.f{flex:1;min-width:240px}
.hint{font-size:12.5px;color:var(--muted);margin:7px 0 0}.hint b{color:var(--fg)}
.dim{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--border-strong);background:var(--deep);color:var(--fg);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.sm{height:30px;padding:0 10px;font-size:13px}.btn.ghost{background:transparent}
.radio-line,.check{display:flex;gap:9px;align-items:flex-start;margin:6px 0;cursor:pointer}
.check small{display:block;color:var(--muted);font-size:12px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 24px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.choice button{text-align:left;border:1px solid var(--border-strong);background:var(--deep);color:var(--fg);border-radius:12px;padding:13px 14px;cursor:pointer;font:inherit}
.choice button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice b{display:block;margin-bottom:3px}.choice .d{display:block;color:var(--muted);font-size:13px}.choice .ex{display:block;color:var(--faint);font:12px var(--mono);margin-top:5px}
.rule{display:grid;grid-template-columns:1fr auto 1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px}
.tog{height:38px;min-width:40px;border-radius:9px;border:1px solid var(--border-strong);background:var(--deep);color:var(--muted);font:600 12px var(--mono);cursor:pointer}
.tog.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:10px 13px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.stat.acc b{color:var(--accent)}.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;background:var(--deep);border:1px solid var(--border);font-size:13.5px;margin-top:10px}
.note.info{background:var(--accent-soft);border-color:transparent}.note.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input[type=search]{max-width:240px;height:32px}
.chip{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--border-strong);background:var(--deep);color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.chip .n{font:11px var(--mono);margin-left:4px;opacity:.8}
.tree{border:1px solid var(--border);border-radius:10px;max-height:460px;overflow:auto;background:var(--deep)}
.node{display:flex;align-items:center;gap:7px;padding:4px 10px;border-bottom:1px solid var(--border);font-size:13px;min-height:34px}
.node:last-child{border-bottom:0}.node.skip{opacity:.45}.node .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.node .new{color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .sp{flex:1}
.node select{width:auto;height:28px;font-size:12.5px;padding:0 6px}.node .ic{width:16px;text-align:center;flex:none}
.tw{border:0;background:none;color:var(--muted);cursor:pointer;width:18px;padding:0;flex:none}.tw.none{display:inline-block}
.mini{font:11px var(--mono);padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}.mini.l{background:var(--ok-soft);color:var(--ok)}
.sz{font:11.5px var(--mono);color:var(--faint)}
.runbar{position:sticky;bottom:12px;z-index:5;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.runbar .sum{flex:1;min-width:240px;font-size:13.5px}.warnbox{color:var(--warn);font-size:12.5px}
.prog{height:6px;background:var(--deep);border-radius:99px;overflow:hidden;margin:8px 0 2px;border:1px solid var(--border)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.verdict{padding:12px 14px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}.verdict.mid{background:var(--warn-soft);color:var(--warn)}
.verdict .sm{font-weight:400;font-size:12.5px;opacity:.85}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 12px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}.tabs .n{font:11px var(--mono);color:var(--accent);margin-left:4px}
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:520px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--deep);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl .nw{white-space:nowrap}.tbl .pth{font:11.5px var(--mono);color:var(--muted);max-width:380px;overflow-wrap:anywhere}
.old{color:var(--muted)}.ren{color:var(--accent)}
.st{font:600 11.5px var(--mono)}.st.ERROR,.st.FAIL{color:var(--bad)}.st.EXISTS,.st.SKIPPED,.st.WARN{color:var(--warn)}.st.PASS,.st.COPIED,.st.CREATED{color:var(--ok)}.st.SKIP{color:var(--faint)}
.logbox{font:12px/1.6 var(--mono);background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:10px 12px;max-height:420px;overflow:auto;white-space:pre-wrap}
.logbox .e{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
details.rows summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:4px}
details.rows .box{font:11.5px/1.5 var(--mono);white-space:pre-wrap;color:var(--muted);margin-top:6px}
.pathline{margin-top:12px;font-size:13px;color:var(--muted);padding:8px 11px;border-radius:9px;background:var(--deep);border:1px dashed var(--border-strong)}
.hist-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:10px 14px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.bad{border-color:var(--bad);color:var(--bad)}.toast.ok{border-color:var(--ok)}
footer{color:var(--faint);font-size:12px;text-align:center;margin-top:24px}
@media (max-width:640px){.rule{grid-template-columns:1fr 1fr}.rule .arrow{display:none}.runbar{bottom:6px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">⧉</div>
  <div><h1>Drive Clone</h1><div class="sub">Clone thư mục Google Drive A → B · đổi tên hàng loạt · Change Log · hậu kiểm</div></div>
  <span class="grow"></span>
  <div class="who" id="who"><span class="spin"></span> Đang kết nối Google…</div>
  <div class="seg" id="modeSeg"><button data-m="real">Google Drive của tôi</button><button data-m="demo">Demo (giả lập)</button></div>
</header>
<div class="wrap" id="app"></div>
<?!= include('Pipeline'); ?>
<?!= include('App'); ?>
</body>
</html>
