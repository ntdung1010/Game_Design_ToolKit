<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Đăng nhập · GD Toolkit</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/theme.js"></script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; overflow-x: hidden;
    background: radial-gradient(900px 520px at 50% 0%, rgba(165, 148, 255, .14), transparent 65%), var(--bg); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask: radial-gradient(circle at 50% 40%, #000, transparent 75%); mask: radial-gradient(circle at 50% 40%, #000, transparent 75%); }
  .lg-wrap { width: min(430px, 100%); position: relative; }
  .lg-mascot { display: flex; justify-content: center; margin-bottom: -26px; position: relative; z-index: 2; }
  .lg-mascot .mascot { --ms-size: 128px; }
  .lg-card { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--border-strong); border-radius: 4px; padding: 36px 26px 24px; box-shadow: var(--shadow); position: relative; }
  .lg-card::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--rainbow); }
  .lg-card::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-right: 1px solid var(--fg); border-bottom: 1px solid var(--fg); opacity: .6; }
  .lg-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .lg-brand b { display: block; font-size: 19px; letter-spacing: -.01em; }
  .lg-brand span { color: var(--muted); font-size: 13px; }
  .lg-card h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.03em; font-weight: 600; }
  .lg-card p.lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .lg-field { margin-bottom: 14px; }
  .lg-pw { position: relative; }
  .lg-pw input { height: 46px; font-size: 15.5px; padding-right: 46px; }
  .lg-text { height: 46px; font-size: 15.5px; width: 100%; }
  .lg-hint code { font-size: .92em; }
  .lg-eye { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .lg-eye:hover { color: var(--fg); background: var(--accent-soft); }
  .lg-btn { width: 100%; height: 46px; font-size: 15px; margin-top: 4px; }
  .lg-meter { height: 6px; border-radius: 99px; background: var(--deep); border: 1px solid var(--border); overflow: hidden; margin-top: 8px; }
  .lg-meter i { display: block; height: 100%; width: 0; transition: width .2s; background: var(--faint); }
  .lg-meter i.bad { background: var(--danger); } .lg-meter i.warn { background: var(--warn); } .lg-meter i.ok { background: var(--ok); }
  .lg-hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  .lg-err { display: none; margin: 4px 0 12px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; background: var(--danger-soft); color: var(--danger); }
  .lg-err.show { display: block; }
  .lg-help { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .lg-help summary { cursor: pointer; color: var(--accent); }
  .lg-help code { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 8px; }
  .lg-foot { text-align: center; color: var(--faint); font-size: 11px; margin-top: 16px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .signature { position: fixed; right: 14px; bottom: 10px; font: 11.5px var(--mono); color: var(--faint); pointer-events: none; }
  .signature b { color: var(--accent); font-weight: 600; }
  svg.i { width: 18px; height: 18px; }
</style>
</head>
<body>
<main class="lg-wrap">
  <div class="lg-mascot"><div id="lgMascot"></div></div>
  <div class="lg-card">
    <div class="lg-brand"><img src="/assets/logo.svg" width="44" height="44" alt=""><div><b>GD Toolkit</b><span>Golden Game Design Toolkit</span></div></div>
    <div id="box"><div style="text-align:center;padding:20px"><span class="spin"></span></div></div>
  </div>
  <div class="lg-foot">tài khoản riêng từng người · mật khẩu lưu dạng băm scrypt</div>
</main>
<div class="signature">Design by <b>Dũng NT</b></div>
<script src="/assets/mascot.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
